          - RP-AC56
          - RT-AC1200
          - RT-AC1200GU
          - RT-AC1200HP
          - RT-AC51U
          - RT-AC54U
          - RT-N10C1
          - RT-N11P
          - RT-N11PB1
          - RT-N12plus
          - RT-N13UB1
          - RT-N14U
          - RT-N56U
          - RT-N56U-GE2
          - RT-N56UB1
          # ATEL
          - ALR-U270
          # BELKIN
          - F9K1103
          # DLINK
          - DIR-300B1
          - DIR-300B7
          - DIR-320B1
          - DIR-620A1
          - DIR-620D1
          - DIR-860L
          - DIR-882
          # GL
          - GL-MT300A
          - GL-MT300N
          - GL-MT300NV2
          # HIWIFI
          - HC5661A
          # KROKS
          - KNDRT31R26
          - KNDRT31R3
          # LINKSYS
          - EA-8100
          # MQMAKER
          - MQ-WITI-256
          - MQ-WITI-512
          # NEWIFI
          - NEWIFI-D1
          - NEWIFI-D2
          - NEWIFI-MINI
          - NEWIFI-Y1S
          # NEXX
          - WT3020A
          - WT3020H
          - WT3020H16M
          # PHICOMM
          - 256PSG1218
          - PSG1218
          # SAMSUNG
          - SWR1100
          # SERCOMM
          - RT-S1010
          - SMARTBOX_SPI
          - SMBXPRONAND
          - SMBXTURBO
          # SNR
          - SNR-MD1
          - SNR-ME1
          - SNR-W4N-M
          - SNR-W4N-M_USB
          # TOTOLINK
          - A3004NS
          # TPLINK
          - TL_C2-V1
          - TL_C20-V1
          - TL_C20-V1_16M
          - TL_C20-V4
          - TL_C20-V5
          - TL_C5-V4
          - TL_C50-V1
          - TL_C50-V3
          - TL_C50-V4
          - TL_EC220_G5-V2
          - TL_MR200-V1
          - TL_MR3020-V3
          - TL_MR3420-V5
          - TL_WDR7300-V5
          - TL_WR840N-V4
          - TL_WR840N-V4_USB
          - TL_WR840N-V5
          - TL_WR840N-V5_RU
          - TL_WR840N-V6
          - TL_WR841N-V13
          - TL_WR841N-V13_USB
          - TL_WR841N-V14
          - TL_WR841N-V14_8M
          - TL_WR842N-V5
          - TL_WR845N-V3
          - TL_WR845N-V4
          # TUOSHI
          - TS7620N
          # UBNT
          - UBNT-ERX
          # UNIELEC
          - U7621-06
          # WALL-AP
          - WALL-AP
          # XIAOMI-U-Boot
          - MI-4A_100M
          - MI-4C
          - MI-MINI
          - MI-R3Gv2
          # XIAOMI
          - MI-3
          - MI-3C
          - MI-3_SPI
          - MI-4
          - MI-MINI
          - MI-NANO
          - MI-R3G
          - MI-R3G_SPI
          - MI-R3PRO
          - MI-R3P_SPI
          - R2100
          - RM-AC2100
          # YOUHUA
          - WR1200JS
          # YOUKU
          - YK-L1
          - YK-L1C
          # ZBT
          - ZBT-WE1326
          - ZBT-WE1626
          - ZBT-WE826T2
          - ZBT-WG3526-32
          - ZBT-WG3526
          - ZBT-WR8305RT
          # ZTE
          - ZTE_E8820S
          # ZYXEL
          - KN-4G3
          - KN-4G3B
          - KN-EXTRA
          - KN-EXTRA2
          - KN-GIGA3
          - KN-LITE
          - KN-LITE2
          - KN-LITE3
          - KN-LITE3B
          - KN-OMNI
          - KN-OMNI2
          - KN-START2
          - KN-ULTRA2
          - KN-VIVA

      language_select:
        description: "WebUI 語言設定 (Custom Language Selector)"
        required: true
        type: choice
        default: 'English_Only'
        options:
          - English_Only
          - CN (繁體中文)
          - RU (Pусский)
          - BR (Brazil)
          - CZ (Česky)
          - DA (Dansk)
          - DE (Deutsch)
          - ES (Español)
          - FI (Finsk)
          - FR (Français)
          - NO (Norsk)
          - PL (Polski)
          - SV (Svensk)
          - UK (Українська)

      nanoversion:
        description: "開啟極限瘦身 (Nano Optimization)"
        type: boolean
        default: true

      customization:
        description: '自訂預設配置 JSON (Custom Default Configuration Wi-Fi/Passwords/IP)'
        required: true
        type: string
        default: '{"lanip":"192.168.0.1","signaccount":"admin","signpassword":"admin","wifi2gssid":"Elektronika","wifi2gpsk":"dupelabnet","wifi5gssid":"Elektronika 5GHz","wifi5gpsk":"dupelabnet"}'

  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    container: registry.gitlab.com/hadzhioglu/padavan-ng
    defaults: { run: { shell: bash } }

    steps:
      - name: Checkout Workflow
        uses: actions/checkout@v4

      # 0. 環境初檢
      - name: Debug - Initial Environment Check
        run: |
          echo "::group::System Info"
          echo "User: $(whoami)"
          echo "PWD: $(pwd)"
          df -h
          echo "::endgroup::"

      # 1. 安裝依賴
      - name: Install Dependencies & Fix Timezone
        run: |
          echo "::group::Apt Update & Install"
          set -x 
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y tzdata autoconf autoconf-archive automake autopoint bison build-essential \
          ca-certificates cmake cpio curl dos2unix doxygen fakeroot flex gawk gettext git gperf \
          help2man htop kmod libarchive-tools libblkid-dev libc-ares-dev libcurl4-openssl-dev \
          libdevmapper-dev libev-dev libevent-dev libexif-dev libflac-dev libgmp3-dev \
          libid3tag0-dev libidn2-dev libjpeg-dev libkeyutils-dev libltdl-dev libmpc-dev \
          libmpfr-dev libncurses5-dev libogg-dev libsqlite3-dev libssl-dev libsystemd-dev \
          libtool libtool-bin libudev-dev libunbound-dev libvorbis-dev libxml2-dev locales \
          mc nano pkg-config ppp-dev python3 python3-docutils sshpass texinfo unzip uuid \
          uuid-dev vim wget xxd zlib1g-dev jq zip
          set +x
          echo "::endgroup::"

          echo "::group::Timezone Configuration"
          ln -fs /usr/share/zoneinfo/Asia/Taipei /etc/localtime
          dpkg-reconfigure -f noninteractive tzdata
          echo "BUILD_TIME=$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV
          echo "::endgroup::"

      # 2. 設定變數
      - name: Get variables
        run: |
          echo "::group::Variable Loading"
          if [ -f "variables" ]; then
            sed -i 's|\r$||g' variables
            . variables
          fi
          
          echo "PADAVAN_REPO=https://github.com/TW641/padavan-ng" >> $GITHUB_ENV
          echo "PADAVAN_BRANCH=master" >> $GITHUB_ENV
          echo "PADAVAN_COMMIT=HEAD" >> $GITHUB_ENV
          
          if [ -z "$PADAVAN_THEMES_REPO" ]; then
            echo "PADAVAN_THEMES_REPO=https://gitlab.com/hadzhioglu/padavan-themes.git" >> $GITHUB_ENV
            echo "PADAVAN_THEMES_BRANCH=main" >> $GITHUB_ENV
          fi
          
          for v in "${!PADAVAN_@}" "${!CONFIG_@}"; do
            echo "$v=${!v}" >> $GITHUB_ENV
          done
          echo "::endgroup::"

      # 3. 下載源碼
      - name: Download sources and toolchain
        run: |
          echo "::group::Git Clone"
          git config --global --add safe.directory '*'
          git clone -b "$PADAVAN_BRANCH" "$PADAVAN_REPO"
          if [ "$PADAVAN_COMMIT" != "HEAD" ] && [ ! -z "$PADAVAN_COMMIT" ]; then
            git -C padavan-ng checkout "$PADAVAN_COMMIT"
          fi
          wget -qO- "$PADAVAN_TOOLCHAIN_URL" | tar -C padavan-ng --zstd -xf -
          echo "::endgroup::"

      # 4. 生成 Config (🔥 4MB / 8MB 智慧自適應版)
      - name: Generate build.config & Apply Nano
        run: |
          TNAME="${{ inputs.target_select }}"
          [ -z "$TNAME" ] && TNAME="TL_WR840N-V6"
          echo "::group::Template Search & Config Gen"
          
          TEMPLATE_DIR="padavan-ng/trunk/configs/templates"
          PATTERN_A=$(echo "$TNAME" | sed 's/-/_/g')
          PATTERN_B=$(echo "$TNAME")
          TARGET_FILE=$(find "$TEMPLATE_DIR" -maxdepth 2 \( -iname "${PATTERN_A}.config" -o -iname "${PATTERN_B}.config" \) | head -n 1)
          
          if [ -z "$TARGET_FILE" ]; then
            echo "::warning:: Template not found, using fallback..."
            TARGET_FILE="padavan-ng/trunk/configs/templates/tplink/tl_c2-v1.config"
          fi
          
          if [ ! -f "$TARGET_FILE" ]; then
            echo "::error:: Config file not found: $TARGET_FILE"
            exit 1
          fi
          cp -f "$TARGET_FILE" build.config
          FINAL_CONFIG="build.config"
          
          # 🔥 判定是否為 4MB 裝置 (WR840N, 4M機型等)
          IS_4M_DEVICE=false
          if [[ "$TNAME" =~ 4M|840|841|4C|N10|N11|N12|A5-V11_4M ]]; then
             IS_4M_DEVICE=true
             echo "IS_4M_DEVICE=true" >> $GITHUB_ENV
             echo "⚡ Detected 4MB Device ($TNAME): Activating Ultra-Slim Mode!"
          else
             echo "IS_4M_DEVICE=false" >> $GITHUB_ENV
             echo "ℹ️ Standard/Large Flash Device ($TNAME)."
          fi
          echo "::endgroup::"
          
          # === 極限瘦身邏輯 (Ultimate Nano - TC/Cake Ready) ===
          if [ "${{ inputs.nanoversion }}" == "true" ] || [ "$IS_4M_DEVICE" = true ]; then
            echo "::group::Nano Optimization - Final Execution"
         
            # 1. [體積優化] 強制開啟 Size Optimization
            sed -i "s/#CONFIG_CC_OPTIMIZE_FOR_SIZE=y/CONFIG_CC_OPTIMIZE_FOR_SIZE=y/g" "$FINAL_CONFIG"
         
            # 2. [基礎切除] 停用 USB, 檔案系統, Swap, 媒體驅動
            for feat in USB ANTFS FAT EXFAT EXT2 EXT3 EXT4 XFS HFS FUSE SWAP BACKPORTED; do
              sed -i "s/CONFIG_FIRMWARE_ENABLE_${feat}=y/CONFIG_FIRMWARE_ENABLE_${feat}=n/gi" "$FINAL_CONFIG"
            done
         
            # 3. [語言包精準控制] 
            sed -i "s/CONFIG_FIRMWARE_INCLUDE_LANG_EN=n/CONFIG_FIRMWARE_INCLUDE_LANG_EN=y/g" "$FINAL_CONFIG"
            sed -i "s/CONFIG_FIRMWARE_INCLUDE_LANG_CN=y/CONFIG_FIRMWARE_INCLUDE_LANG_CN=n/g" "$FINAL_CONFIG"
            sed -i "s/CONFIG_FIRMWARE_INCLUDE_LANG_RU=y/CONFIG_FIRMWARE_INCLUDE_LANG_RU=n/g" "$FINAL_CONFIG"
            sed -i "s/CONFIG_FIRMWARE_INCLUDE_LANG_UK=y/CONFIG_FIRMWARE_INCLUDE_LANG_UK=n/g" "$FINAL_CONFIG"
         
            # 4. [地毯式移除]
            echo "::group::Absolute Disable Modules"
            modules=(
              CIFS NTFS_3G LPRD U2EC USBIP HDPARM PARTED SMBD WINS SMBD_SYSLOG TESTPARM 
              FTPD FTPD_SSL NFSD NFSC
              UVC HID SERIAL AUDIO FIREFLY XUPNPD MINIDLNA FFMPEG_NEW 
              RPL2TP EAP_PEAP OPENVPN SSWAN WIREGUARD AMNEZIAWG ZEROTIER EOIP XFRM
              SHADOWSOCKS XRAY V2RAY TROJAN SSOBFS SINGBOX NAIVEPROXY
              REDSOCKS SRELAY MENTOHUST FRPC FRPS TOR TOR_GEOIP TOR_GEOIPV6
              PRIVOXY NFQWS
              IPSET DNSCRYPT STUBBY DOH QUIC QUIC_NGTCP2 NDISC6_RDISC6
              ADBYBY DNSFORWARDER SMARTDNS ADGUARDHOME WPAD
              LRZSZ IPERF3 DUMP1090 RTL_SDR SOCAT MTR 
              IMQ IFB
              ZRAM ADB LUA SQM ALDRIVER SCUTCLIENT GDUT_DRCOM DOGCOM MINIEAP 
              NJIT_CLIENT SOFTETHERVPN_SERVER SOFTETHERVPN_CLIENT SOFTETHERVPN_CMD
              DROPBEAR_FAST_CODE VLMCSD TTYD MSD_LITE
              DDNS_SSL
            )
         
            for mod in "${modules[@]}"; do
              CFG_KEY="CONFIG_FIRMWARE_INCLUDE_${mod}"
              if grep -q "$CFG_KEY" "$FINAL_CONFIG"; then
                sed -i "s|^.*$CFG_KEY.*$|$CFG_KEY=n|" "$FINAL_CONFIG"
              else
                echo "$CFG_KEY=n" >> "$FINAL_CONFIG"
              fi
            done
            echo "::endgroup::"
          fi

          # 🔥 核心模組依 Flash 大小智慧注入 (避免 4MB 塞爆)
          echo "::group::Core Modules Enforcement"
          if [ "$IS_4M_DEVICE" = true ]; then
            echo "🔒 4MB Flash: Keeping only essential Dropbear, HWNAT and QoS..."
            # 停用昂貴的大套件
            for heavy in OPENSSH SFTP TCPDUMP CURL HTTPS OPENSSL_EC OPENSSL_EXE; do
               sed -i "/CONFIG_FIRMWARE_INCLUDE_${heavy}/d" "$FINAL_CONFIG"
               echo "CONFIG_FIRMWARE_INCLUDE_${heavy}=n" >> "$FINAL_CONFIG"
            done
            # 啟用極簡 SSH (Dropbear) 與 核心加速
            for light in DROPBEAR SHORTCUT_FE QOS; do
               sed -i "/CONFIG_FIRMWARE_INCLUDE_${light}/d" "$FINAL_CONFIG"
               echo "CONFIG_FIRMWARE_INCLUDE_${light}=y" >> "$FINAL_CONFIG"
            done
          else
            echo "🔓 8MB+ Flash: Full feature set enabled..."
            keep_modules=(OPENSSH SFTP TCPDUMP CURL HTTPS OPENSSL_EC OPENSSL_EXE SHORTCUT_FE QOS)
            for kmod in "${keep_modules[@]}"; do
              sed -i "/CONFIG_FIRMWARE_INCLUDE_${kmod}/d" "$FINAL_CONFIG"
              echo "CONFIG_FIRMWARE_INCLUDE_${kmod}=y" >> "$FINAL_CONFIG"
            done
          fi
          echo "::endgroup::"

      # 5. 應用自定義設定 (JSON)
      - name: Apply Custom Settings
        run: |
          echo "::group::JSON Parsing & Export"
          jq empty <<< '${{ inputs.customization }}' || { echo "❌ Invalid JSON"; exit 1; }
          
          echo '${{ inputs.customization }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"' | while IFS='=' read -r k v; do
            echo "${k^^}=$v" >> $GITHUB_ENV  
          done
          
          LANIP=$(echo '${{ inputs.customization }}' | jq -r .lanip)
          SIGNACCOUNT=$(echo '${{ inputs.customization }}' | jq -r .signaccount)
          SIGNPASSWORD=$(echo '${{ inputs.customization }}' | jq -r .signpassword)
          WIFI2GSSID=$(echo '${{ inputs.customization }}' | jq -r .wifi2gssid)
          WIFI2GPSK=$(echo '${{ inputs.customization }}' | jq -r .wifi2gpsk)
          WIFI5GSSID=$(echo '${{ inputs.customization }}' | jq -r .wifi5gssid)
          WIFI5GPSK=$(echo '${{ inputs.customization }}' | jq -r .wifi5gpsk)
          
          if [ -d "padavan-ng/trunk/custom/scripts" ]; then
            cd padavan-ng
            chmod +x trunk/custom/scripts/*.sh
            [ ! -z "$LANIP" ] && bash trunk/custom/scripts/setip.sh "$LANIP" trunk/user/shared/defaults.h trunk/user/www/dict/CN.dict || true
            [ ! -z "$SIGNACCOUNT" ] && bash trunk/custom/scripts/setaccount.sh "$SIGNACCOUNT" "$SIGNPASSWORD" trunk/user/shared/defaults.h || true
            [ ! -z "$WIFI2GSSID" ] && bash trunk/custom/scripts/setwifi.sh "$WIFI2GSSID" "$WIFI2GPSK" "$WIFI5GSSID" "$WIFI5GPSK" trunk/user/shared/defaults.h || true
          fi
          echo "::endgroup::"

      # 6. 安裝 Themes (4MB 裝置跳過額外主題，節省 300KB)
      - name: Install themes
        run: |
          echo "::group::Themes Installation"
          if [ "$IS_4M_DEVICE" = true ]; then
            echo "⚡ 4MB device: Skipping extra themes to save ROM space."
          else
            if [ -f "variables" ]; then . variables; fi
            if [[ -n "${PADAVAN_THEMES[*]}" ]]; then
              git clone --depth 1 -b "$PADAVAN_THEMES_BRANCH" "$PADAVAN_THEMES_REPO" themes
              cp -r themes/common-theme themes/jquery.js padavan-ng/trunk/user/www/n56u_ribbon_fixed
              for theme in "${PADAVAN_THEMES[@]}"; do
                [ -d "themes/$theme-theme" ] && cp -r "themes/$theme-theme" padavan-ng/trunk/user/www/n56u_ribbon_fixed
              done
            fi
          fi
          echo "::endgroup::"

      # 7. 修正 mkimage
      - name: Fix mkimage
        run: |
          MKIMAGE_FILE="padavan-ng/trunk/tools/mkimage/mkimage.c"
          if [ -f "$MKIMAGE_FILE" ]; then
            sed -i 's/"%d\.%d"/"%hhd.%hhd"/g' "$MKIMAGE_FILE"
            sed -i 's/"%d\.%d%c"/"%hhd.%hhd%c"/g' "$MKIMAGE_FILE"
          fi

      # 7.4. BusyBox 1.37.0
      - name: 🔥 Sync & Evolve BusyBox (V44:Integrated)
        run: |
          set -x
          echo "::group::BusyBox Evolution V44"
          readonly WORK_DIR="padavan-ng"
          readonly REPO_ROOT="$WORK_DIR"
          readonly ORIGINAL_CONFIG="$REPO_ROOT/trunk/configs/boards/busybox.config"
          readonly TARGET_DIR="$REPO_ROOT/trunk/user/busybox"
          
          if [ ! -d "$TARGET_DIR" ]; then exit 1; fi
          cd "$TARGET_DIR"
          if [ -d "busybox-1.37.0" ]; then cd "busybox-1.37.0"; fi
          
          readonly SYNC_TARGET_1=".config"
          readonly SYNC_TARGET_2="../.config"
          readonly SYNC_TARGET_3="../../../configs/boards/busybox.config"

          CHECKS_SET=(
              "CONFIG_SH_IS_ASH y" "CONFIG_BASH_IS_ASH y" "CONFIG_ASH y" "CONFIG_ASH_OPTIMIZE_FOR_SIZE y"
              "CONFIG_ASH_INTERNAL_GLOB y" "CONFIG_ASH_BASH_COMPAT y" "CONFIG_ASH_JOB_CONTROL y"
              "CONFIG_ASH_ALIAS y" "CONFIG_ASH_EXPAND_PRMT y" "CONFIG_ASH_GETOPTS y" "CONFIG_ASH_CMDCMD y"
              "CONFIG_ASH_HELP y" "CONFIG_ASH_RANDOM_SUPPORT y" "CONFIG_ASH_IDLE_TIMEOUT y"
              "CONFIG_SYSLOGD y" "CONFIG_FEATURE_ROTATE_LOGFILE y" "CONFIG_FEATURE_REMOTE_LOG y"
              "CONFIG_KLOGD y" "CONFIG_LOGGER y" "CONFIG_UDHCPC_DEFAULT_INTERFACE \"eth3\""
              "CONFIG_SHA1_SMALL 1" "CONFIG_DHCP6C y" "CONFIG_FEATURE_UDHCPC_SANITIZEOPT y"
              "CONFIG_NTPD y" "CONFIG_IPCALC y" "CONFIG_NC y" "CONFIG_NC_SERVER y"
              "CONFIG_NO_LOOP_CONFIGURE y" "CONFIG_BZIP2_SMALL 9" "CONFIG_CRC32 y" "CONFIG_SHA256SUM y"
              "CONFIG_RUN_INIT y" "CONFIG_POWEROFF y" "CONFIG_REBOOT y" "CONFIG_GETOPT y"
              "CONFIG_XXD y" "CONFIG_SWAPON y" "CONFIG_SWAPOFF y"
          )
          
          CHECKS_UNSET=(
              "CONFIG_SH_IS_HUSH" "CONFIG_BASH_IS_HUSH" "CONFIG_BASH_IS_NONE" "CONFIG_HUSH"
              "CONFIG_FEATURE_DHCP6_AUTH" "CONFIG_TRY_LOOP_CONFIGURE" "CONFIG_LOOP_CONFIGURE"
              "CONFIG_FEATURE_WGET_FTP" "CONFIG_WHOIS" "CONFIG_UDHCPD" "CONFIG_DHCPRELAY"
              "CONFIG_FEATURE_NTPD_CONF" "CONFIG_IP" "CONFIG_TC" "CONFIG_TCPSVD" "CONFIG_UDPSVD"
          )

          audit_config() {
              local FILE=$1; local LIST_NAME=$2; local FAILURES=()
              if [ ! -f "$FILE" ]; then return 1; fi
              for ENTRY in "${CHECKS_SET[@]}"; do
                  KEY=${ENTRY%% *}; VAL=${ENTRY#* }
                  if ! grep -q "^${KEY}=${VAL}$" "$FILE"; then FAILURES+=("$ENTRY"); fi
              done
              for KEY in "${CHECKS_UNSET[@]}"; do
                  if grep -q "^${KEY}=" "$FILE"; then FAILURES+=("$KEY UNSET"); fi
              done
              if [ ${#FAILURES[@]} -gt 0 ]; then eval "$LIST_NAME=(\"\${FAILURES[@]}\")"; return 1; fi
              return 0
          }

          apply_fixes() {
              local FILE=$1; local ITEMS=("${@:2}")
              for ITEM in "${ITEMS[@]}"; do
                  if [[ "$ITEM" == *" UNSET" ]]; then
                      KEY=${ITEM% UNSET}
                      sed -i "/$KEY/d" "$FILE"
                      echo "# $KEY is not set" >> "$FILE"
                  else
                      KEY=${ITEM%% *}; VAL=${ITEM#* }
                      sed -i "/$KEY/d" "$FILE"
                      echo "$KEY=$VAL" >> "$FILE"
                  fi
              done
          }

          if [ -f "$SYNC_TARGET_3" ]; then cp -f "$SYNC_TARGET_3" .config; fi
          yes "" | make oldconfig || true

          for ENTRY in "${CHECKS_SET[@]}"; do sed -i "/${ENTRY%% *}/d" .config; done
          for KEY in "${CHECKS_UNSET[@]}"; do sed -i "/$KEY/d" .config; done

          {
              echo "# --- Custom Injection Start ---"
              for ENTRY in "${CHECKS_SET[@]}"; do echo "${ENTRY%% *}=${ENTRY#* }"; done
              for KEY in "${CHECKS_UNSET[@]}"; do echo "# $KEY is not set"; done
              echo "# --- Custom Injection End ---"
          } >> .config

          yes "" | make oldconfig || true

          FAIL_LIST_1=()
          audit_config ".config" FAIL_LIST_1 || apply_fixes ".config" "${FAIL_LIST_1[@]}"

          mkdir -p "$(dirname "$SYNC_TARGET_3")"
          cp -f .config "$SYNC_TARGET_2"
          cp -f .config "$SYNC_TARGET_3"

          cd "../../rc"
          if [ -f "services.c" ]; then
              sed -i 's/syslogd_argv\[7\] = "-L";/\/* & *\//' services.c || true
          fi

          cd ../.. 
          grep -rl "busybox-1.24.x" user/ | xargs -r sed -i "s/busybox-1.24.x/busybox-1.37.0/g" || true
          grep -rl "busybox-1.24.2" user/ | xargs -r sed -i "s/busybox-1.24.2/busybox-1.37.0/g" || true

          set +x
          echo "::endgroup::"

      # 7.5. Upgrade iptables 1.8.11
      - name: 🔥 Auto Upgrade iptables 1.8.11 & Patch
        run: |
          set +e
          echo "::group::Iptables Upgrade & Patching"
          NEW_VER="iptables-1.8.11"
          IPT_MAKEFILE=$(find padavan-ng/trunk/user/iptables -name Makefile | head -n 1)
          IPT_DIR=$(dirname "$IPT_MAKEFILE")
          IPT_ROOT="$IPT_DIR/$NEW_VER"
          OLD_VER_STR=$(grep -o 'iptables-[0-9.]*' "$IPT_MAKEFILE" | head -n 1)
          [ -z "$OLD_VER_STR" ] && OLD_VER_STR="iptables-1.8.10"

          if [ ! -d "$IPT_ROOT" ]; then
              TAR_FILE="$IPT_DIR/$NEW_VER.tar.xz"
              wget --no-check-certificate -q -O "$TAR_FILE" "https://www.netfilter.org/projects/iptables/files/$NEW_VER.tar.xz" || true
              [ -f "$TAR_FILE" ] && tar -xJf "$TAR_FILE" -C "$IPT_DIR" || true
          fi

          sed -i "s/$OLD_VER_STR/$NEW_VER/g" "$IPT_MAKEFILE"
          sed -i 's/^all: config_test/all: download_test extract_test config_test/' "$IPT_MAKEFILE"
          sed -i '/.\/autogen.sh/d' "$IPT_MAKEFILE"
          sed -i '/extensions\/disabled\//d' "$IPT_MAKEFILE"

          grep -rl "$OLD_VER_STR" padavan-ng/trunk/user/ | while read -r file ; do
              sed -i "s/$OLD_VER_STR/$NEW_VER/g" "$file"
          done
          echo "::endgroup::"

      # 7.6 [網路工具] Arptables (🔥 4MB 裝置自動跳過以保護空間)
      - name: 🔥 Network Tools (Smart Compile Arptables)
        run: |
          echo "::group::Smart Compile Network Tools"
          if [ "$IS_4M_DEVICE" = true ]; then
            echo "⚡ 4MB device: Skipping Arptables to prevent ROM overflow."
          else
            BASE_DIR="$GITHUB_WORKSPACE/padavan-ng/trunk/user"
            ARP_ROOT="$BASE_DIR/arptables"
            mkdir -p "$ARP_ROOT"
            cd "$ARP_ROOT" || exit 0
            if [ ! -f "Makefile" ]; then
              wget --no-check-certificate "https://www.netfilter.org/pub/arptables/arptables-0.0.5.tar.gz" -O arptables.tar.gz || true
              if [ -f "arptables.tar.gz" ]; then
                tar -xf arptables.tar.gz && rm -f arptables.tar.gz
                ARP_SRC_NAME=$(ls -d arptables-0*/ | head -n 1 | sed 's/\///')
                cat << EOF > Makefile
          SRC_NAME=$ARP_SRC_NAME
          all:
          	\$(MAKE) -C \$(SRC_NAME) CC="\$(CC)" AR="\$(AR)" KERNEL_DIR=\$(KERNEL_HEADERS_PATH) COPT_FLAGS="-Os" arptables-legacy
          romfs:
          	\$(ROMFSINST) \$(SRC_NAME)/arptables-legacy /bin/arptables
          clean:
          	\$(MAKE) -C \$(SRC_NAME) clean
          EOF
                sed -i '/dir_y += ebtables/a dir_y += arptables' "$BASE_DIR/Makefile" || true
              fi
            fi
          fi
          echo "::endgroup::"

      # 7.7 Patch MT7610E Driver
      - name: 🔥 Patch MT7610E Driver (Anti-Disconnect & Fast Reconnect)
        run: |
          echo "::group::Applying Ultimate Driver Patch"
          TARGET_APCLI=$(find padavan-ng/trunk/proprietary/rt_wifi/rtpci/3.0.X.X -type f -name "ap_apcli.c" | grep "mt7610" | head -n 1)
          TARGET_CTRL=$(find padavan-ng/trunk/proprietary/rt_wifi/rtpci/3.0.X.X -type f -name "apcli_ctrl.c" | grep "mt7610" | head -n 1)

          if [ -f "$TARGET_APCLI" ] && [ -f "$TARGET_CTRL" ]; then
            sed -i 's/12[[:space:]]*\*[[:space:]]*OS_HZ/60 * OS_HZ/g' "$TARGET_APCLI"
            sed -i 's/^[[:space:]]*NdisZeroMemory.*ApCliMlmeAux.Bssid/\/\/&/' "$TARGET_CTRL"
            sed -i 's/^[[:space:]]*.*ApCliMlmeAux.SsidLen[[:space:]]*=[[:space:]]*0/\/\/&/' "$TARGET_CTRL"
            sed -i 's/^[[:space:]]*NdisZeroMemory.*ApCliMlmeAux.Ssid,/\/\/&/' "$TARGET_CTRL"
            sed -i 's/^[[:space:]]*.*ApCliMlmeAux.Rssi[[:space:]]*=[[:space:]]*0/\/\/&/' "$TARGET_CTRL"
            echo "✅ Driver patched."
          else
            echo "ℹ️ No MT7610E driver files required for this device. Skipping."
          fi
          echo "::endgroup::"

      # 7.8 語言切換
      - name: 🌐 Custom Language Selector
        run: |
          echo "::group::Setting up WebUI Language"
          SELECTED_LANG_OPTION="${{ inputs.language_select }}"
          TARGET_BOARD="${{ inputs.target_select }}"
          TEMPLATES_DIR="padavan-ng/trunk/configs/templates"
          CONFIG_PATH=$(find "$TEMPLATES_DIR" -type f -name "*.config" | grep -i "$TARGET_BOARD" | head -n 1)
          
          if [ -f "$CONFIG_PATH" ]; then
            sed -i 's/^CONFIG_FIRMWARE_INCLUDE_LANG_.*=y/#&/' "$CONFIG_PATH"
            if [ "$SELECTED_LANG_OPTION" != "English_Only" ] && [ "$IS_4M_DEVICE" != true ]; then
              LANG_CODE=$(echo "$SELECTED_LANG_OPTION" | cut -d' ' -f1)
              echo "CONFIG_FIRMWARE_INCLUDE_LANG_$LANG_CODE=y" >> "$CONFIG_PATH"
            fi
          fi
          echo "::endgroup::"

      # 7.9 CAKE Patch
      - name: 🕊️ Dave Täht Tribute & CAKE Patch
        run: |
          echo "::group::Applying CAKE to Kernel 3.4 Config"
          TARGET_BOARD="${{ inputs.target_select }}"
          BOARDS_DIR="padavan-ng/trunk/configs/boards"
          CONFIG_PATH=$(find "$BOARDS_DIR" -name "kernel-3.4.x.config" | grep "/$TARGET_BOARD/" | head -n 1)
          [ -z "$CONFIG_PATH" ] && CONFIG_PATH=$(find "$BOARDS_DIR" -type f -name "kernel-3.4.x.config" | grep "$TARGET_BOARD" | head -n 1)

          if [ -f "$CONFIG_PATH" ]; then
            if ! grep -qE "CONFIG_NET_SCH_CAKE=[ym]" "$CONFIG_PATH"; then
              sed -i '/CONFIG_NET_SCH_FQ_CODEL=/a CONFIG_NET_SCH_CAKE=m' "$CONFIG_PATH" || echo "CONFIG_NET_SCH_CAKE=m" >> "$CONFIG_PATH"
            fi
            echo "🎉 CAKE Patch Applied."
          fi
          echo "::endgroup::"

      # 8. 開始編譯
      - name: Build firmware
        run: |
          echo "::group::Build Process"
          cp build.config padavan-ng/trunk/.config
          cd padavan-ng/trunk
          ./clear_tree.sh > /dev/null 2>&1
          rm -rf tmp staging
          ./build_firmware.sh 2>&1 | tee build.log
          echo "::endgroup::"

      # 9. 智慧打包與產物偵測
      - name: Smart-Pack & Debug Collection
        run: |
          echo "::group::Smart Packing"
          [ -f "padavan-ng/trunk/.config" ] && source "padavan-ng/trunk/.config"

          WORK_DIR=$(pwd)
          PACK_DIR="$WORK_DIR/output_pack"
          IMAGES_DIR="$WORK_DIR/padavan-ng/trunk/images"
          PARTITIONS_FILE="$WORK_DIR/padavan-ng/trunk/configs/boards/$CONFIG_VENDOR/$CONFIG_FIRMWARE_PRODUCT_ID/partitions.config"
          mkdir -p "$PACK_DIR"
          REPORT_FILE="$PACK_DIR/file_report.txt"
          touch "$REPORT_FILE"

          [ -f "padavan-ng/trunk/.config" ] && cp "padavan-ng/trunk/.config" "$PACK_DIR/build.config"
          [ -f "padavan-ng/trunk/user/shared/defaults.h" ] && cp "padavan-ng/trunk/user/shared/defaults.h" "$PACK_DIR/defaults.h.txt"
          [ -f "padavan-ng/trunk/build.log" ] && cp "padavan-ng/trunk/build.log" "$PACK_DIR/build.log"

          # 檢查是否有生成 firmware 產物
          FW_COUNT=$(find "$IMAGES_DIR" -maxdepth 1 -type f \( -name "*.trx" -o -name "*.bin" \) | wc -l)
          if [ "$FW_COUNT" -eq 0 ]; then
             echo "::error:: ❌ No firmware binary was generated! It exceeded the partition flash size."
             tail -n 60 padavan-ng/trunk/build.log
             exit 1
          fi

          find "$IMAGES_DIR" -maxdepth 1 -type f \( -name "*.trx" -o -name "*.bin" \) | while read -r file; do
            fname=$(basename "$file")
            fsize=$(stat -c %s "$file")
            cp -v "$file" "$PACK_DIR/"
            echo "- 💿 **Firmware**: \`$fname\` ($(numfmt --to=iec $fsize))" >> "$REPORT_FILE"
          done

          cd "$PACK_DIR"
          for f in *; do [ -f "$f" ] && md5sum "$f" >> md5sum.txt; done

          FILE_REPORT_CONTENT=$(cat file_report.txt)
          {
            echo "FILE_REPORT<<EOF"
            echo "$FILE_REPORT_CONTENT"
            echo "EOF"
          } >> $GITHUB_ENV
          
          cd "$WORK_DIR"
          ZIP_NAME="padavan_pack_${CONFIG_VENDOR}_${CONFIG_FIRMWARE_PRODUCT_ID}.zip"
          zip -j -r "$ZIP_NAME" "$PACK_DIR"
          echo "ZIP_FILE_PATH=$WORK_DIR/$ZIP_NAME" >> $GITHUB_ENV
          echo "BUILD_TIMESTAMP=$(TZ='Asia/Taipei' date '+%Y.%m.%d_%H.%M.%S')" >> $GITHUB_ENV
          echo "CONFIG_VENDOR=$CONFIG_VENDOR" >> $GITHUB_ENV
          echo "CONFIG_FIRMWARE_PRODUCT_ID=$CONFIG_FIRMWARE_PRODUCT_ID" >> $GITHUB_ENV
          echo "::endgroup::"

      - name: Upload artifacts (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: padavan_${{ env.CONFIG_VENDOR }}_${{ env.CONFIG_FIRMWARE_PRODUCT_ID }}_${{ env.BUILD_TIMESTAMP }}
          path: ${{ env.ZIP_FILE_PATH }}

      # 10. 發布 Release
      - name: Publish Release
        if: github.event_name == 'workflow_dispatch'
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit: ${{ github.sha }}
          tag: "${{ inputs.target_select }}-${{ env.BUILD_TIMESTAMP }}"
          name: "${{ inputs.target_select }} [${{ env.BUILD_TIMESTAMP }}]"
          body: |
            ### Padavan CAKE Build Summary
            * **Target**: ${{ inputs.target_select }}
            * **LAN IP**: ${{ env.LANIP }}
            * **SSID**: ${{ env.WIFI2GSSID }} / ${{ env.WIFI5GSSID }}
            * **CAKE Bufferbloat**: Supported (`modprobe sch_cake`)
            * **Flash Check**: Passed

            ### 📦 Artifacts
            ${{ env.FILE_REPORT }}
          artifacts: ${{ env.ZIP_FILE_PATH }}
          allowUpdates: true
          artifactErrorsFailBuild: true
