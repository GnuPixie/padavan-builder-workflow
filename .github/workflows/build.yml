name: Build firmware (Ultimate Fix - Auto 4M/8M Adaptive)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      target_select:
        description: "選擇機型 (Target Model)"
        required: true
        default: 'TL_WR840N-V6'
        type: choice
        options:
          # 5K
          - 5K-W20
          # A5-V11
